services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-accord_test}
      POSTGRES_USER: ${POSTGRES_USER:-accord}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-accord}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accord -d accord_test"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: agora-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-agora}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-agoradevpassword}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  # Docker API for the sandbox runner (npm run runner), restricted to the calls it
  # makes (sandbox-isolation-spec §3, T9). Container operations are limited to
  # agora-run-* names; bind mounts are rejected. Published on localhost only.
  socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    profiles: ["sandbox"]
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "127.0.0.1:2375:2375"
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      - "-allowfrom=0.0.0.0/0"
      - "-allowbindmountfrom=/nonexistent-agora-no-bind-mounts"
      - "-allowHEAD=(/v1\\.[0-9]+)?/_ping"
      - "-allowGET=(/v1\\.[0-9]+)?/(_ping|version|info|containers/json|containers/agora-run-[0-9a-z]{26}/(json|logs)|networks/agora_sandbox[a-z0-9_]*|images/.+/json)"
      - "-allowPOST=(/v1\\.[0-9]+)?/containers/(create|agora-run-[0-9a-z]{26}/(start|wait|kill))"
      - "-allowDELETE=(/v1\\.[0-9]+)?/containers/agora-run-[0-9a-z]{26}"

volumes:
  minio-data:
