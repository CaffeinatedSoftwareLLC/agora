name: CI

# Runs on every PR and on pushes to main. Fork PRs need manual approval before this
# runs (repo setting), and the workflow token is read-only. No secrets are used here,
# so nothing in this workflow is worth stealing.
#
# Built for agent PRs: each job runs only when its part of the repo changed, and the
# backend suite is split across four machines. Agents run the same checks locally
# first (`npm run check:changed`, see CLAUDE.md), so CI is the final check, not the loop.
#
# The four required checks (ruleset "protect-main") are the job names Backend, Frontend,
# agora-host and agora-mcp. A job skipped because nothing it covers changed counts as
# passing, so keep those four names as they are.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      cross: ${{ steps.filter.outputs.cross }}
      frontend: ${{ steps.filter.outputs.frontend }}
      host: ${{ steps.filter.outputs.host }}
      mcp: ${{ steps.filter.outputs.mcp }}
      relay: ${{ steps.filter.outputs.relay }}
      boxes: ${{ steps.filter.outputs.boxes }}
      sandbox: ${{ steps.filter.outputs.sandbox }}
      install: ${{ steps.filter.outputs.install }}
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # A change to this workflow runs everything.
          filters: |
            backend:
              - 'src/**'
              - 'test/**'
              - 'scripts/**'
              - 'package.json'
              - 'package-lock.json'
              - 'tsconfig*.json'
              - 'vitest*.ts'
              # test/unit/nginx-routes reads it
              - 'agora-ui/nginx.conf'
              - '.github/workflows/ci.yml'
            cross:
              - 'agora-mcp/**'
              - 'agora-host/**'
            frontend:
              - 'agora-ui/**'
              - '.github/workflows/ci.yml'
            host:
              - 'agora-host/**'
              - 'box/**'
              - '.github/workflows/ci.yml'
            mcp:
              - 'agora-mcp/**'
              - '.github/workflows/ci.yml'
            relay:
              - 'agora-push-relay/**'
              - '.github/workflows/ci.yml'
            # The box stack end to end (docs/agent-boxes.md §14): anything a box, boxd, the edge,
            # their auth or the installer is made of
            install:
              - 'install/**'
              - 'test/install/**'
              - 'box/**'
              - 'scripts/setup-env.js'
              - 'docker-compose.prod.yml'
              - '.github/workflows/ci.yml'
            boxes:
              - 'box/**'
              - 'install/**'
              - 'src/boxes/**'
              - 'src/lib/boxes/**'
              - 'src/box*-main.ts'
              - 'src/auth/**'
              - 'src/gateway.ts'
              - 'src/routes/box*.ts'
              - 'src/db/migrations/**'
              - 'agora-host/**'
              - 'agora-mcp/**'
              - 'test/boxes/**'
              - 'test/install/**'
              - 'scripts/test-boxes.sh'
              - 'docker-compose.prod.yml'
              - 'Dockerfile'
              - 'vitest.box.config.ts'
              - '.github/workflows/ci.yml'
            # Code runs: the runner, its socket proxy rules, the sandbox network, the image and the
            # gateway runs talk to (sandbox-isolation-spec §6, §14)
            sandbox:
              - 'src/runtime/**'
              - 'src/runner-main.ts'
              - 'src/gateway/**'
              - 'src/gateway-main.ts'
              - 'sandbox/**'
              - 'test/sandbox/**'
              - 'scripts/test-sandbox-gvisor.sh'
              - 'scripts/lib/socket-proxy-rules.js'
              - 'scripts/lib/engine-guard.sh'
              - 'docker-compose.prod.yml'
              - 'vitest.sandbox.config.ts'
              - '.github/workflows/ci.yml'
            skills:
              - '.claude/skills/**'
              - '.agents/**'
              - '.codex/skills/**'
              - '.gemini/skills/**'
              - '.opencode/skills/**'
              - '.claude-plugin/**'
              - 'plugins/**'
              - 'scripts/sync-skills.js'
              - '.github/workflows/ci.yml'

  # The full backend suite, split into four parts that run at the same time. Tests in one
  # part still run one file at a time against that machine's own Postgres.
  backend-shard:
    name: Backend part ${{ matrix.shard }}/4
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
          POSTGRES_DB: accord_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U accord -d accord_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://accord:accord@localhost:5432/accord_test
      TEST_DATABASE_URL: postgres://accord:accord@localhost:5432/accord_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-not-for-prod
      # Dummy 32-byte key for tests only; config.ts rejects it outside NODE_ENV=production.
      AGORA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The type-check build runs once, in part 1.
      - if: matrix.shard == 1
        run: npm run build
      - run: npm ci --prefix agora-mcp
      - run: npm ci --prefix agora-host
      - run: npm test -- --shard=${{ matrix.shard }}/4

  # When only agora-mcp or agora-host changed, run just the backend tests that import them.
  backend-cross:
    name: Backend tests that use agora-mcp or agora-host
    needs: changes
    if: needs.changes.outputs.backend != 'true' && needs.changes.outputs.cross == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
          POSTGRES_DB: accord_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U accord -d accord_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgres://accord:accord@localhost:5432/accord_test
      TEST_DATABASE_URL: postgres://accord:accord@localhost:5432/accord_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-not-for-prod
      AGORA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --prefix agora-mcp
      - run: npm ci --prefix agora-host
      - run: npx vitest run $(grep -rlE "from '(\.\./)+agora-(mcp|host)/" test | sort)

  # The required check. Passes when every backend job that ran passed.
  backend:
    name: Backend (build + tests)
    needs: [changes, backend-shard, backend-cross]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the backend jobs
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.backend-shard.result }}" "${{ needs.backend-cross.result }}"; do
            case "$r" in success|skipped) ;; *) echo "::error::a backend job ended with: $r"; exit 1 ;; esac
          done

  frontend:
    name: Frontend (lint + build + tests)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agora-ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agora-ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      # Typecheck app, test and config files (tsconfig.app, tsconfig.test, tsconfig.node).
      - run: npx tsc -b
      # Same command as agora-ui/Dockerfile.
      - run: npx vite build
      - run: npm test

  agora-host:
    name: agora-host (build + tests)
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agora-host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agora-host/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  agora-push-relay:
    name: agora-push-relay (type-check + tests)
    needs: changes
    if: needs.changes.outputs.relay == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The store tests run against Postgres too (the Heroku deploy); they create and drop
    # a database of their own, and fail rather than skip when CI has no TEST_DATABASE_URL.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: accord
          POSTGRES_PASSWORD: accord
          POSTGRES_DB: accord_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U accord -d accord_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://accord:accord@localhost:5432/accord_test
    defaults:
      run:
        working-directory: agora-push-relay
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agora-push-relay/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test

  agora-mcp:
    name: agora-mcp (build + tests)
    needs: changes
    if: needs.changes.outputs.mcp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: agora-mcp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agora-mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  # Isolation (#39), recovery and reboot tests on a real stack with boxes under gVisor. Also on
  # arm64: a Mac's VM (docs/macos.md) is arm64 Linux, and every box CLI has an arm64 build.
  boxes:
    name: Boxes (isolation, recovery, reboot under gVisor) (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.boxes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -q && sudo apt-get install -yq runsc
          sudo runsc install && sudo systemctl restart docker
          docker run --rm --runtime=runsc alpine uname -r
      - run: npm ci
      - run: bash scripts/test-boxes.sh
        env:
          BOXTEST_ALLOW_DAEMON_RESTART: '1'

  # The real box image (not the test image's fake CLIs): it builds for this CPU, and every pinned
  # CLI starts under gVisor. The Dockerfile already runs each --version under runc while building.
  box-image:
    name: Box image (real CLIs under gVisor) (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.boxes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -q && sudo apt-get install -yq runsc
          sudo runsc install && sudo systemctl restart docker
          docker run --rm --runtime=runsc alpine uname -r
          runsc --version
      - name: Build box/Dockerfile (target box)
        run: docker build -f box/Dockerfile --target box --build-arg BOX_VERSION="$(cat box/VERSION)" -t agora/box:ci .
      - name: Every CLI starts under runsc
        run: |
          for cli in claude codex opencode omp devin; do
            echo "== $cli"
            timeout 120 docker run --rm --runtime=runsc --network none --entrypoint "/opt/agora/bin/$cli" agora/box:ci --version
          done

  # The code-run suites (test/sandbox: the runner, the negative security suite of
  # sandbox-isolation-spec §14, the socket proxy between installs #126) on real gVisor containers,
  # also on arm64 (a Mac's VM).
  sandbox:
    name: Sandbox (code runs under gVisor) (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.sandbox == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install gVisor
        run: |
          curl -fsSL https://gvisor.dev/archive.key | sudo gpg --dearmor -o /usr/share/keyrings/gvisor-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/gvisor-archive-keyring.gpg] https://storage.googleapis.com/gvisor/releases release main" | sudo tee /etc/apt/sources.list.d/gvisor.list
          sudo apt-get update -q && sudo apt-get install -yq runsc
          sudo runsc install && sudo systemctl restart docker
          docker run --rm --runtime=runsc alpine uname -r
      - run: bash scripts/test-sandbox-gvisor.sh

  # The Linux installer on a fresh runner: installs gVisor, builds, starts, makes the admin and a
  # boxed agent (test image), checks it answers a mention and that the doctor is happy. On arm64
  # too: it is what the macOS installer runs inside its Ubuntu arm64 VM.
  install-linux:
    name: Installer (Linux, clean machine) (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.install == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: bash test/install/lib.test.sh
      - name: macOS installer scripts (shellcheck, decisions with Lima stubbed)
        run: |
          command -v shellcheck >/dev/null || { sudo apt-get update -q && sudo apt-get install -yq shellcheck; }
          shellcheck -x -P SCRIPTDIR -S warning install/macos/*.sh install/macos/lib/macos.sh install/macos/guest/host-firewall.sh test/install/macos.test.sh
          bash test/install/macos.test.sh
      - run: bash test/install/backup.test.sh
      - run: bash test/install/upgrade.test.sh
      - run: bash test/install/db-password.test.sh
      - run: bash test/install/uninstall.test.sh
      # Adds a docker group to check the installer's group handling, so it needs root
      - run: sudo bash test/install/install.test.sh
      - run: bash test/install/clean-install.sh

  # The macOS installer's decisions on a Mac, under its own /bin/bash 3.2, with plutil checking the
  # launchd plist. Lima, Homebrew and launchd are stubbed: GitHub's macOS runners can't start a
  # VM (no nested virtualization), so the real run is docs/testing/macos-test-plan.md.
  install-macos:
    name: Installer (macOS decisions, Lima stubbed)
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: /bin/bash --version | head -n 1
      - run: /bin/bash test/install/macos.test.sh

  # The Windows installer's decisions (WSL missing, an existing engine distro, Docker Desktop,
  # reboot resume, telemetry off), with wsl.exe and docker mocked. CI runners have no WSL2.
  install-windows:
    name: Installer (Windows decisions, Pester)
    needs: changes
    if: needs.changes.outputs.install == 'true'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Scope CurrentUser -Force -SkipPublisherCheck
          Invoke-Pester install/windows/tests -CI

  # The skill copies and the agora-skills plugin must match .claude/skills, and a change to
  # the plugin's skills must come with a new plugin version, or installed plugins never update.
  skills:
    name: Skills (copies + plugin version)
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node scripts/sync-skills.js --check --base "${{ github.event.pull_request.base.sha || github.event.before }}"
