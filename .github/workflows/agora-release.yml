name: Agora release

# Attaches what the installers download (docs/installing.md, install/linux/install.sh) to an
# app release (tag v<version>):
#   agora.tar.gz         the source at that tag, one top folder (`agora/`)
#   agora.tar.gz.sha256  `sha256sum agora.tar.gz`; the installer checks it before unpacking
#   install.sh           install/linux/install.sh, so a bare `curl … install.sh` works
#   install.ps1          install/windows/bootstrap.ps1: downloads agora.tar.gz, checks it, runs
#                        install\windows\install.ps1 from it
# and copies them to the fixed release agora-latest, so the installers' "latest" link never
# depends on which release GitHub marks Latest (agora-mcp releases share the repo, #288).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: App release tag to build and attach to (e.g. v0.4.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: agora-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    # agora-mcp releases (agora-mcp-v*) and the fixed link releases have their own handling
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'v') && !startsWith(github.event.release.tag_name, 'agora-mcp-'))
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - name: Check package version matches tag
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${TAG}" ]; then
            echo "::error::package.json version ${version} does not match tag ${TAG}"
            exit 1
          fi

      - name: Build the assets
        run: |
          git archive --format=tar.gz --prefix=agora/ -o agora.tar.gz "refs/tags/${TAG}"
          sha256sum agora.tar.gz > agora.tar.gz.sha256
          cp install/linux/install.sh install.sh
          cp install/windows/bootstrap.ps1 install.ps1

      - name: Upload release assets
        run: gh release upload "${TAG}" agora.tar.gz agora.tar.gz.sha256 install.sh install.ps1 --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Update the agora-latest install link
        run: |
          notes="The installers' download link: https://github.com/${GITHUB_REPOSITORY}/releases/download/agora-latest/install.sh (Linux) and install.ps1 (Windows). It holds Agora ${TAG}. The Agora release workflow replaces it on every app release."
          if ! gh release view agora-latest --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release create agora-latest --repo "${GITHUB_REPOSITORY}" --target "$(git rev-parse HEAD)" \
              --title "Agora install link" --notes "${notes}" --prerelease --latest=false
          else
            gh release edit agora-latest --repo "${GITHUB_REPOSITORY}" --notes "${notes}"
          fi
          gh release upload agora-latest agora.tar.gz agora.tar.gz.sha256 install.sh install.ps1 --clobber --repo "${GITHUB_REPOSITORY}"
