name: agora-mcp release

# Builds agora-mcp and attaches it to a GitHub Release as two assets:
#   caffeinated-software-agora-mcp-<version>.tgz  (pinned installs)
#   agora-mcp.tgz                                 (the install link)
# and copies agora-mcp.tgz to the fixed release agora-mcp-latest, so the install link
# releases/download/agora-mcp-latest/agora-mcp.tgz never depends on which release GitHub
# marks Latest (#288). agora-mcp releases are tagged agora-mcp-v<version>; app releases
# keep v<version> and are skipped here.
# agora-mcp is never published to the npm registry.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach to (e.g. agora-mcp-v0.7.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: agora-mcp-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    # App releases (v*) have nothing to build here
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.release.tag_name, 'agora-mcp-v')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agora-mcp/package-lock.json

      - name: Check package version matches tag
        working-directory: agora-mcp
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "agora-mcp-v${version}" != "${TAG}" ]; then
            echo "::error::agora-mcp/package.json version ${version} does not match tag ${TAG}"
            exit 1
          fi

      - name: Build and test
        working-directory: agora-mcp
        run: |
          npm ci
          npm run build
          npm test

      - name: Pack
        working-directory: agora-mcp
        run: |
          tarball="$(npm pack --silent | tail -n 1)"
          cp "${tarball}" agora-mcp.tgz
          echo "TARBALL=${tarball}" >> "$GITHUB_ENV"

      - name: Upload release assets
        working-directory: agora-mcp
        run: gh release upload "${TAG}" "${TARBALL}" agora-mcp.tgz --clobber --repo "${GITHUB_REPOSITORY}"

      - name: Update the agora-mcp-latest install link
        working-directory: agora-mcp
        run: |
          version="$(node -p "require('./package.json').version")"
          notes="The install link for agora-mcp: npm install -g https://github.com/${GITHUB_REPOSITORY}/releases/download/agora-mcp-latest/agora-mcp.tgz. It holds agora-mcp ${version} (${TAG}). The agora-mcp release workflow replaces it on every agora-mcp release."
          if ! gh release view agora-mcp-latest --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            gh release create agora-mcp-latest --repo "${GITHUB_REPOSITORY}" --target "$(git rev-parse HEAD)" \
              --title "agora-mcp install link" --notes "${notes}" --prerelease --latest=false
          else
            gh release edit agora-mcp-latest --repo "${GITHUB_REPOSITORY}" --notes "${notes}"
          fi
          gh release upload agora-mcp-latest agora-mcp.tgz --clobber --repo "${GITHUB_REPOSITORY}"
