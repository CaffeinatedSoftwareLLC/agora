version: '3.8'

services:
  # One-shot migration runner — runs before API starts, then exits
  migrate:
    build:
      context: ./server
      dockerfile: Dockerfile
    command: ["node", "dist/db/migrate.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-accord}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${DB_NAME:-accord}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"  # run once and exit

  # API + WebSocket server
  api:
    build: ./server
    ports:
      - "${API_PORT:-3000}:3000"
    env_file: .env
    environment:
      DATABASE_URL: postgres://${DB_USER:-accord}:${DB_PASSWORD:?Set DB_PASSWORD}@postgres:5432/${DB_NAME:-accord}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-uploads}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Web client
  web:
    build: ./client
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      - api
    restart: unless-stopped

  # Database
  postgres:
    image: postgres:16-alpine
    volumes:
      - pgdata:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_NAME:-accord}
      POSTGRES_USER: ${DB_USER:-accord}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-accord}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Cache + Pub/Sub
  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # File storage (S3-compatible)
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Voice — uncomment for Phase 3
  # livekit:
  #   image: livekit/livekit-server
  #   ports:
  #     - "7880:7880"
  #     - "7881:7881"
  #     - "7882:7882/udp"
  #   volumes:
  #     - ./livekit.yaml:/etc/livekit.yaml
  #   command: --config /etc/livekit.yaml
  #   restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
