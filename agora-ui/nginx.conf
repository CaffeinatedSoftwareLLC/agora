server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;

    # Find the API through Docker's DNS on every request (cached 10 s) instead of once at
    # startup. A fixed `proxy_pass http://api:3000` keeps the address api had when nginx
    # started, so after a crash or an api restart that gives it a new one, every API
    # call answers 502 until web is restarted too. A variable in proxy_pass makes nginx
    # resolve it at request time. Without a URI part the request URI passes unchanged.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:3000;
    set $mcp http://mcp:3100;

    # Admin SPA pages (agora-ui/src/App.tsx, /admin/*). The API owns the /admin prefix
    # too, so these exact paths are matched before the API regex below (regex locations
    # are tried in order). Two of them are also API endpoints, GET /admin/users and
    # GET /admin/storage: the UI's fetch() calls send no Accept: text/html and a browser
    # page load does, so the Accept header decides, the same rule the Vite dev proxy
    # uses (vite.config.ts). Add new /admin/<page> SPA routes to this regex.
    # One URL, two representations chosen by Accept, so both responses carry
    # Vary: Accept or a cached HTML page can answer the JSON fetch (and the reverse).
    # The HTML side is served by the /index.html location below after the rewrite;
    # add_header here only reaches the proxied JSON.
    location ~ ^/admin(/(pending|users|provider-terms|settings|storage))?/?$ {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        add_header Vary Accept always;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes → backend (single regex — add new prefixes here). Each prefix must be
    # a whole path segment, so (/|$): /admin must not match /administrator, /files must
    # not match /files-page, and so on.
    location ~ ^/(auth|servers|channels|invites|agent-invites|admin|terms-watch|users|health|instance|unreads|messages|roles|files|bots|runtime|agent-hosts|boxes|box-edge-requests|me)(/|$) {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # MCP over Streamable HTTP → the mcp service (agora-mcp http, docs/mcp-http.md). Not the
    # API: a chat_wait holds its response open for up to AGORA_MCP_HTTP_MAX_WAIT_SECONDS
    # (1500 s by default), streamed as server-sent events, so no buffering and a read timeout
    # above that. The bot token travels in Authorization, which nginx passes on unchanged.
    location ~ ^/mcp(/|$) {
        proxy_pass $mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket — Socket.IO
    location /socket.io {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Every route that ends up on the app shell (the fallback above and the admin
    # rewrite) lands here. Vary: Accept pairs with the admin location's JSON.
    location = /index.html {
        add_header Vary Accept always;
    }
}
