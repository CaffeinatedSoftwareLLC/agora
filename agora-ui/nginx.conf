server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 0;

    # Admin SPA pages (agora-ui/src/App.tsx, /admin/*). The API owns the /admin prefix
    # too, so these exact paths are matched before the API regex below (regex locations
    # are tried in order). Two of them are also API endpoints, GET /admin/users and
    # GET /admin/storage: the UI's fetch() calls send no Accept: text/html and a browser
    # page load does, so the Accept header decides, the same rule the Vite dev proxy
    # uses (vite.config.ts). Add new /admin/<page> SPA routes to this regex.
    location ~ ^/admin(/(pending|users|provider-terms|settings|storage))?/?$ {
        if ($http_accept ~* "text/html") {
            rewrite ^ /index.html last;
        }
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API routes → backend (single regex — add new prefixes here). Each prefix must be
    # a whole path segment, so (/|$): /admin must not match /administrator, /files must
    # not match /files-page, and so on.
    location ~ ^/(auth|servers|channels|invites|agent-invites|admin|terms-watch|users|health|instance|unreads|messages|roles|files|bots|runtime|agent-hosts)(/|$) {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket — Socket.IO
    location /socket.io {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
