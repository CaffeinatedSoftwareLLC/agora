services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agora
      POSTGRES_USER: accord
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accord -d agora"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/src/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://accord:${DB_PASSWORD}@postgres:5432/agora
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "50000-50100:50000-50100/udp"
    volumes:
      - ./livekit.prod.yaml:/etc/livekit.yaml
    depends_on:
      redis:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://accord:${DB_PASSWORD}@postgres:5432/agora
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      HOST: 0.0.0.0
      PORT: "3000"
      LIVEKIT_URL: wss://${DOMAIN:-alpha.agora.host}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-devkey}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-secret}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./agora-ui
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - web

volumes:
  caddy_data:
  pgdata:
  redisdata:
