services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agora
      POSTGRES_USER: accord
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.prod}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U accord -d agora"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/src/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://accord:${DB_PASSWORD}@postgres:5432/agora
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # One-shot. The services run as an unprivileged user; an uploads volume created
  # before 0.2.0 is owned by root, so hand it over once. A no-op on later starts.
  files-perms:
    build:
      context: .
      dockerfile: Dockerfile
    user: "0:0"
    command: ["sh", "-c", "if [ \"$$(stat -c %u /data/files)\" != \"$$(id -u node)\" ]; then chown -R node:node /data/files && echo 'files-data handed to node'; else echo 'files-data already owned by node'; fi"]
    volumes:
      - files-data:/data/files
    network_mode: none
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    # Plain HTTP for agents on this machine only; everything else goes through Caddy.
    # API_BIND=0.0.0.0 reopens it to the network (prefer https://<domain> instead).
    ports:
      - "${API_BIND:-127.0.0.1}:${AGORA_API_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgres://accord:${DB_PASSWORD}@postgres:5432/agora
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.prod}
      HOST: 0.0.0.0
      PORT: "3000"
      # The browser's origin. Follows DOMAIN unless CORS_ORIGIN is set explicitly.
      CORS_ORIGIN: ${CORS_ORIGIN:-https://${DOMAIN:-localhost}}
      TRUST_PROXY: "true"
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Passkeys: origins they may be registered/used from (default: CORS_ORIGIN + https://localhost)
      WEBAUTHN_ORIGINS: ${WEBAUTHN_ORIGINS:-}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-Agora}
      LOGIN_MAX_FAILURES: ${LOGIN_MAX_FAILURES:-10}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      LOGIN_GLOBAL_PER_MINUTE: ${LOGIN_GLOBAL_PER_MINUTE:-60}
      STORAGE_DIR: /data/files
      AGORA_ENCRYPTION_KEY: ${AGORA_ENCRYPTION_KEY:?Set AGORA_ENCRYPTION_KEY in .env.prod}
      # Set to 1 for one start to record a different key (data under the old key is lost)
      AGORA_ACCEPT_NEW_ENCRYPTION_KEY: ${AGORA_ACCEPT_NEW_ENCRYPTION_KEY:-}
      # Verifies the box edge's request signatures (docs/agent-boxes.md §4.1); same value as box-edge
      AGORA_EDGE_SECRET: ${AGORA_EDGE_SECRET:?Set AGORA_EDGE_SECRET in .env.prod (setup-env.js generates it)}
      AGORA_INSTANCE: ${AGORA_INSTANCE:-agora}
      # Where Admin → Report setup problem sends a report (only when the admin presses Send)
      AGORA_TELEMETRY_URL: ${AGORA_TELEMETRY_URL:-https://push.agora.host}
    volumes:
      - files-data:/data/files
    depends_on:
      migrate:
        condition: service_completed_successfully
      files-perms:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # MCP over Streamable HTTP (docs/mcp-http.md): the Agora tools for MCP clients that take a URL
  # instead of starting agora-mcp themselves (NemoClaw, hosted agents). No published port: nginx
  # proxies /mcp to it, so it is reached through Caddy's or Tailscale's HTTPS like the UI. Each
  # request carries the agent's bot token; the service holds no secrets of its own.
  mcp:
    build:
      context: ./agora-mcp
      dockerfile: Dockerfile
    environment:
      AGORA_API_URL: http://api:3000
      # Longest chat_wait, in seconds (at most 3600)
      AGORA_MCP_HTTP_MAX_WAIT_SECONDS: ${AGORA_MCP_HTTP_MAX_WAIT_SECONDS:-1500}
      AGORA_MCP_HTTP_IDLE_MINUTES: ${AGORA_MCP_HTTP_IDLE_MINUTES:-30}
      AGORA_MCP_HTTP_SESSIONS_PER_TOKEN: ${AGORA_MCP_HTTP_SESSIONS_PER_TOKEN:-16}
      AGORA_MCP_HTTP_MAX_SESSIONS: ${AGORA_MCP_HTTP_MAX_SESSIONS:-500}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3100/mcp/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      - api
    restart: unless-stopped

  # ─── Agent boxes (docs/agent-boxes.md) ───
  # Requires gVisor (runsc) on the host; AGORA_BOX_INSECURE_DEV=1 uses runc (dev and CI only).

  # Build-only: the image every box runs (box/Dockerfile, tag from box/VERSION).
  # AGORA_BOX_VERSION is kept in step with box/VERSION by the installer and install/upgrade.sh.
  box-image:
    build:
      context: .
      dockerfile: box/Dockerfile
      # `box` (real CLIs) by default; `test` has fake CLIs for the clean-install test
      target: ${AGORA_BOX_TARGET:-box}
      args:
        BOX_VERSION: ${AGORA_BOX_VERSION:-6}
        # scripts/box-build-id.sh (install/lib/common.sh compose_in sets it); empty: boxd never rebuilds for a newer build
        BOX_BUILD: ${AGORA_BOX_BUILD:-}
    image: agora/box:${AGORA_BOX_VERSION:-6}${AGORA_BOX_TAG_SUFFIX:-}
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  # boxd's own restricted Docker API (§7.2). Only names of this instance's boxes: containers
  # <instance>-box-<ulid>, networks <instance>_box_<ulid>, volumes <instance>-box-<ulid>-home.
  # It filters paths, not bodies: create calls carry the name in the query or body, which
  # boxd builds from constants and re-checks by inspecting before every start.
  box-socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env.prod to the host's docker group id: getent group docker | cut -d: -f3}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      - "-allowfrom=boxd"
      - "-allowbindmountfrom=/nonexistent-agora-no-bind-mounts"
      - "-allowHEAD=(/v1\\.[0-9]+)?/_ping"
      - "-allowGET=(/v1\\.[0-9]+)?/(_ping|version|info|containers/json|networks|volumes|containers/${AGORA_INSTANCE:-agora}-box-[0-9a-z]{26}/json|networks/${AGORA_INSTANCE:-agora}_box_[0-9a-z]{26}|volumes/${AGORA_INSTANCE:-agora}-box-[0-9a-z]{26}-home|images/agora/box:[0-9A-Za-z._-]+/json)"
      - "-allowPOST=(/v1\\.[0-9]+)?/(containers/create|containers/${AGORA_INSTANCE:-agora}-box-[0-9a-z]{26}/(start|stop|restart|kill)|networks/create|networks/${AGORA_INSTANCE:-agora}_box_[0-9a-z]{26}/(connect|disconnect)|volumes/create)"
      - "-allowDELETE=(/v1\\.[0-9]+)?/(containers/${AGORA_INSTANCE:-agora}-box-[0-9a-z]{26}|networks/${AGORA_INSTANCE:-agora}_box_[0-9a-z]{26}|volumes/${AGORA_INSTANCE:-agora}-box-[0-9a-z]{26}-home)"

  # The box runner: creates, starts, upgrades and removes boxes. The only box component with
  # Docker access; it reads DB rows and Docker replies, never traffic from a box (§2).
  boxd:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/src/boxd-main.js"]
    # A rebuild stops the old container (30 s timeout); boxd finishes it before exiting, and
    # install/backup.sh's quiesce relies on that
    stop_grace_period: 90s
    environment:
      DATABASE_URL: postgres://accord:${DB_PASSWORD}@postgres:5432/agora
      REDIS_URL: redis://redis:6379
      AGORA_ENCRYPTION_KEY: ${AGORA_ENCRYPTION_KEY:?Set AGORA_ENCRYPTION_KEY in .env.prod}
      AGORA_INSTANCE: ${AGORA_INSTANCE:-agora}
      AGORA_BOX_DOCKER_HOST: http://box-socket-proxy:2375
      AGORA_BOX_IMAGE: agora/box:${AGORA_BOX_VERSION:-6}${AGORA_BOX_TAG_SUFFIX:-}
      AGORA_BOX_SUBNETS: ${AGORA_BOX_SUBNETS:-10.213.0.0/16}
      AGORA_BOX_INSECURE_DEV: ${AGORA_BOX_INSECURE_DEV:-}
      # Compose names it <project>-box-edge-1; the project is the instance (setup-env sets both)
      AGORA_EDGE_CONTAINER: ${AGORA_INSTANCE:-agora}-box-edge-1
    # On `compose up`. After a reboot Docker restarts containers without this order, so boxd
    # also waits for its dependencies itself (src/lib/startup-retry.ts)
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      box-socket-proxy:
        condition: service_started
      box-image:
        condition: service_completed_successfully
      box-edge:
        condition: service_started
    restart: unless-stopped

  # The box edge: every box's only way out (§4, §5). On the default network; boxd attaches it
  # to each box network at .2. Never exposed through Caddy/nginx, no Docker access.
  box-edge:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/src/box-edge-main.js"]
    environment:
      DATABASE_URL: postgres://accord:${DB_PASSWORD}@postgres:5432/agora
      REDIS_URL: redis://redis:6379
      AGORA_ENCRYPTION_KEY: ${AGORA_ENCRYPTION_KEY:?Set AGORA_ENCRYPTION_KEY in .env.prod}
      AGORA_EDGE_SECRET: ${AGORA_EDGE_SECRET:?Set AGORA_EDGE_SECRET in .env.prod (setup-env.js generates it)}
      AGORA_INSTANCE: ${AGORA_INSTANCE:-agora}
      AGORA_API_UPSTREAM: http://api:3000
    # /healthz answers only over loopback (from anywhere else it is box traffic)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    # On `compose up`. After a reboot Docker restarts containers without this order, so the
    # edge also waits for Postgres itself (src/lib/startup-retry.ts)
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  # ─── Sandboxed runtime (docs/planning/sandbox-isolation-spec.md) ───
  # Requires gVisor (runsc) on the host; without it the runner refuses to start.

  # Build-only: produces the sandbox image the runner launches per run
  sandbox-image:
    build:
      context: ./sandbox
    image: agora/sandbox-deno:local
    entrypoint: ["deno", "--version"]
    network_mode: none
    restart: "no"

  # Restricted Docker API: only reachable by the runner; container operations limited to this
  # install's <instance>-run-<ulid> names; bind mounts rejected. No container list: the proxy
  # matches paths, not query strings, so it can't hold a list to this install's label. So one
  # install's runner never sees, stops or removes another install's runs on this engine (#126).
  # Every per-container call names the container (an ID wouldn't match).
  socket-proxy:
    image: wollomatic/socket-proxy:1.13.1
    restart: unless-stopped
    # The image runs as nobody (65534). On Linux the Docker socket is root:docker 0660,
    # so the proxy needs the host's docker group (the GID differs per host)
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID in .env.prod to the host's docker group id: getent group docker | cut -d: -f3}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      - "-allowfrom=runner"
      - "-allowbindmountfrom=/nonexistent-agora-no-bind-mounts"
      - "-allowHEAD=(/v1\\.[0-9]+)?/_ping"
      # An image reference's segments start with a letter or digit, so a `..` segment can't
      # walk an image path over to another container's inspect
      - "-allowGET=(/v1\\.[0-9]+)?/(_ping|version|info|containers/${AGORA_INSTANCE:-agora}-run-[0-9a-z]{26}/(json|logs)|networks/${AGORA_INSTANCE:-agora}_sandbox|images/[0-9A-Za-z][0-9A-Za-z._:@-]*(/[0-9A-Za-z][0-9A-Za-z._:@-]*)*/json)"
      - "-allowPOST=(/v1\\.[0-9]+)?/containers/(create|${AGORA_INSTANCE:-agora}-run-[0-9a-z]{26}/(start|wait|kill))"
      - "-allowDELETE=(/v1\\.[0-9]+)?/containers/${AGORA_INSTANCE:-agora}-run-[0-9a-z]{26}"

  runner:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/src/runner-main.js"]
    # On SIGTERM the runner takes no new runs and finishes the ones in progress (the longest may
    # take 10 minutes, limits.ts TIME_PROFILES), so a stop or recreate doesn't cut them off
    stop_grace_period: 11m
    environment:
      DATABASE_URL: postgres://accord:${DB_PASSWORD}@postgres:5432/agora
      REDIS_URL: redis://redis:6379
      AGORA_ENCRYPTION_KEY: ${AGORA_ENCRYPTION_KEY:?Set AGORA_ENCRYPTION_KEY in .env.prod}
      AGORA_DOCKER_HOST: http://socket-proxy:2375
      AGORA_SANDBOX_IMAGE: ${AGORA_SANDBOX_IMAGE:-agora/sandbox-deno:local}
      AGORA_INSTANCE: ${AGORA_INSTANCE:-agora}
      AGORA_SANDBOX_NETWORK: ${AGORA_INSTANCE:-agora}_sandbox
      AGORA_CAP_URL: http://cap-gateway:8080
      RUNTIME_PER_SERVER_CONCURRENCY: ${RUNTIME_PER_SERVER_CONCURRENCY:-2}
      RUNTIME_INSTANCE_CONCURRENCY: ${RUNTIME_INSTANCE_CONCURRENCY:-4}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      socket-proxy:
        condition: service_started
      sandbox-image:
        condition: service_completed_successfully
      cap-gateway:
        condition: service_started
    restart: unless-stopped

  # The only service on both networks: sandboxes reach it as cap-gateway:8080.
  # Never exposed through Caddy/nginx.
  cap-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["node", "dist/src/gateway-main.js"]
    environment:
      DATABASE_URL: postgres://accord:${DB_PASSWORD}@postgres:5432/agora
      REDIS_URL: redis://redis:6379
      # Same volume as the API: files posted by runs are served by the API
      STORAGE_DIR: /data/files
      AGORA_ENCRYPTION_KEY: ${AGORA_ENCRYPTION_KEY:?Set AGORA_ENCRYPTION_KEY in .env.prod}
      AGORA_ACCEPT_NEW_ENCRYPTION_KEY: ${AGORA_ACCEPT_NEW_ENCRYPTION_KEY:-}
    volumes:
      - files-data:/data/files
    networks: [default, sandbox]
    depends_on:
      migrate:
        condition: service_completed_successfully
      files-perms:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Voice (docs/voice.md), opt-in with --profile voice: free, offline speech on this
  # machine's CPU. No published ports; the api reaches them on the compose network. Add
  # them in Settings → AI as OpenAI-compatible providers (http://kokoro:8880/v1 and
  # http://whisper:8000/v1), which needs "Allow private network base URLs".
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:v0.9.0
    profiles: ["voice"]
    restart: unless-stopped

  whisper:
    image: ghcr.io/speaches-ai/speaches:0.8.3-cpu
    profiles: ["voice"]
    volumes:
      - whisper-models:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped

  web:
    build:
      context: ./agora-ui
      dockerfile: Dockerfile
    depends_on:
      - api
    restart: unless-stopped

  caddy:
    # Pinned by digest; bump deliberately (docker buildx imagetools inspect caddy:<ver>)
    image: caddy:2.11.7@sha256:685ae3d7c34d9b5f8caeddc5d14051db7bbd88ff1f5a2fa0c16bd8ca328fb7af
    restart: unless-stopped
    ports:
      # AGORA_HTTP_PORT / AGORA_HTTPS_PORT: another port for a second install on this machine (#209)
      - "${AGORA_HTTP_PORT:-80}:80"
      - "${AGORA_HTTPS_PORT:-443}:443"
    environment:
      # The Caddyfile serves {$DOMAIN}: a real domain gets a public certificate,
      # localhost gets Caddy's local one
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
    depends_on:
      - web

networks:
  default: {}
  # Internal-only: no route out. Members: cap-gateway + per-run sandbox containers.
  # Named after the instance so two installs on one engine never share it (#209).
  # inhibit_ipv4: the bridge gets no IPv4 address, so the host isn't on this network and a run
  # can't reach host services on the gateway address (agent boxes do the same, networkSpec).
  # The runner refuses a sandbox network without it. Compose doesn't reliably change an existing
  # network: install/upgrade.sh recreates it (install/sandbox-network.sh, spec §6.1).
  sandbox:
    name: ${AGORA_INSTANCE:-agora}_sandbox
    internal: true
    # inhibit_ipv4 covers IPv4 only: keep IPv6 off, whatever the daemon's defaults
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.inhibit_ipv4: "true"

volumes:
  caddy_data:
  # Uploaded files (encrypted at rest). Replaces MinIO (#32); back this up with pgdata
  files-data:
  pgdata:
  redisdata:
  # Speech-to-text models downloaded by the whisper service (voice profile)
  whisper-models:
